{% extends 'dashboard/base.html' %}

{% block page_title %}تصدير البيانات{% endblock %}

{% block content %}
<div class="row g-4">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-people display-4 text-primary mb-3"></i>
                <h5>المستهلكون</h5>
                <p class="text-muted">تصدير جميع بيانات المستهلكين</p>
                <a href="{% url 'dashboard:export_users' %}" class="btn btn-primary">
                    <i class="bi bi-download me-1"></i>تصدير CSV
                </a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-shop display-4 text-success mb-3"></i>
                <h5>الموردون</h5>
                <p class="text-muted">تصدير جميع بيانات الموردين</p>
                <a href="{% url 'dashboard:export_suppliers' %}" class="btn btn-success">
                    <i class="bi bi-download me-1"></i>تصدير CSV
                </a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-chat-dots display-4 text-warning mb-3"></i>
                <h5>المحادثات</h5>
                <p class="text-muted">تصدير جميع بيانات المحادثات</p>
                <a href="{% url 'dashboard:export_conversations' %}" class="btn btn-warning">
                    <i class="bi bi-download me-1"></i>تصدير CSV
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
