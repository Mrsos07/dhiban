{% extends 'base.html' %}

{% block title %}تسجيل الدخول - ذيبان{% endblock %}

{% block content %}
<section class="py-5" style="min-height: 80vh; display: flex; align-items: center; background: linear-gradient(135deg, #f0f4f8 0%, #a7c7e7 100%);">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock display-4" style="color: var(--primary-color);"></i>
                            <h3 class="mt-3">تسجيل دخول الإدارة</h3>
                            <p class="text-muted">أدخل بياناتك للوصول إلى لوحة التحكم</p>
                        </div>
                        
                        {% if messages %}
                        {% for message in messages %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        {% endfor %}
                        {% endif %}
                        
                        <form method="post" action="{% url 'admin_login' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">اسم المستخدم</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">كلمة المرور</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                                <i class="bi bi-box-arrow-in-left me-2"></i>تسجيل الدخول
                            </button>
                            <div class="text-center">
                                <a href="/" class="text-decoration-none" style="color: var(--secondary-color);">
                                    <i class="bi bi-arrow-right me-1"></i>العودة للصفحة الرئيسية
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
